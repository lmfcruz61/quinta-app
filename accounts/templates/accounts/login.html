<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Quinta da Ponte</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #2f5d50, #6fa58c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .card {
            background: #ffffff;
            width: 90%;
            max-width: 360px;
            padding: 30px 25px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #2f5d50;
        }

        p {
            margin-top: 0;
            margin-bottom: 25px;
            color: #666;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background-color: #2f5d50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #24483f;
        }

        .error {
            color: #c0392b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Quinta da Ponte</h2>
        <p>Introduza o seu código de acesso</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="code" placeholder="Código de acesso" required>
            <button type="submit">Entrar</button>
        </form>

        <div class="footer">
            Alojamento Local
        </div>
    </div>

</body>
</html>
