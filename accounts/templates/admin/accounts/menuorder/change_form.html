{% extends "admin/change_form.html" %}
{% load i18n %}

{% block object-tools-items %}
    {{ block.super }}
    {% if original %}
        <li>
            <a href="#" class="historylink" onclick="window.print(); return false;">
                {% trans "Imprimir encomenda" %}
            </a>
        </li>
    {% endif %}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <style>
        @media print {
            #header,
            .breadcrumbs,
            .object-tools,
            .submit-row,
            .messagelist,
            #nav-sidebar,
            .toggle-nav-sidebar {
                display: none !important;
            }

            #container,
            #content,
            #content-main {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }

            body {
                background: white !important;
            }
        }
    </style>
{% endblock %}
