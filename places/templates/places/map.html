{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Map" %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72, #2a6fd6);
            color: white;
            padding: 15px 20px;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.16);
        }

        .brand {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            opacity: 0.92;
        }

        #map {
            height: calc(100vh - 70px);
            width: 100%;
        }

        .locate-button {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 18px;
            z-index: 1000;
            min-height: 48px;
            border: none;
            border-radius: 12px;
            background: #1e3c72;
            color: white;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 8px 22px rgba(0,0,0,0.22);
            cursor: pointer;
        }

        .locate-button:disabled {
            opacity: 0.78;
            cursor: wait;
        }

        .guest-location-dot {
            width: 16px;
            height: 16px;
            border: 3px solid white;
            border-radius: 50%;
            background: #2a6fd6;
            box-shadow: 0 0 0 5px rgba(42,111,214,0.25);
        }

        .place-label {
            padding: 5px 8px;
            border-radius: 8px;
            background: white;
            color: #1e3c72;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0,0,0,0.24);
            pointer-events: none;
        }

        .place-label::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -5px;
            transform: translateX(-50%);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 5px solid white;
        }

        .leaflet-tooltip-top.place-label {
            margin-top: -12px;
            border: none;
        }

        .leaflet-tooltip-top.place-label::before {
            display: none;
        }

        .place-popup {
            max-width: 230px;
        }

        .place-popup img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .place-popup a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: #1e3c72;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .place-popup h3 {
            margin: 0 0 6px;
            color: #1e3c72;
            font-size: 16px;
        }

        .place-popup p {
            margin: 0;
            color: #555;
            font-size: 13px;
            line-height: 1.35;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="brand">{% trans "Quinta da Ponte" %}</div>
    <a href="{% url 'guest_home' %}">⬅ {% trans "Home" %}</a>
</div>

<div id="map"></div>
<button class="locate-button" id="locate-button" type="button">
    📍 {% trans "A minha localização" %}
</button>

{{ places_data|json_script:"places-data" }}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function initMap() {
    const center = [41.705098, -8.791817];

    const map = L.map("map").setView(center, 14);
    const locateButton = document.getElementById("locate-button");
    let guestMarker = null;
    let guestAccuracy = null;

    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        maxZoom: 19,
        subdomains: "abcd",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    }).addTo(map);

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value || "";
        return div.innerHTML;
    }

    function setLocateButton(text, disabled) {
        locateButton.textContent = text;
        locateButton.disabled = disabled;
    }

    locateButton.addEventListener("click", () => {
        if (!navigator.geolocation) {
            setLocateButton("{% trans 'Localização indisponível' %}", false);
            return;
        }

        setLocateButton("{% trans 'A localizar...' %}", true);

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const guestPosition = [
                    position.coords.latitude,
                    position.coords.longitude,
                ];
                const accuracy = position.coords.accuracy || 0;

                if (!guestMarker) {
                    guestMarker = L.marker(guestPosition, {
                        icon: L.divIcon({
                            className: "",
                            html: '<div class="guest-location-dot"></div>',
                            iconSize: [22, 22],
                            iconAnchor: [11, 11],
                        }),
                    }).addTo(map);
                } else {
                    guestMarker.setLatLng(guestPosition);
                }

                if (!guestAccuracy) {
                    guestAccuracy = L.circle(guestPosition, {
                        radius: accuracy,
                        color: "#2a6fd6",
                        fillColor: "#2a6fd6",
                        fillOpacity: 0.12,
                        weight: 1,
                    }).addTo(map);
                } else {
                    guestAccuracy.setLatLng(guestPosition);
                    guestAccuracy.setRadius(accuracy);
                }

                guestMarker.bindPopup("{% trans 'Está aqui' %}").openPopup();
                map.setView(guestPosition, Math.max(map.getZoom(), 16));
                setLocateButton("📍 {% trans 'A minha localização' %}", false);
            },
            () => {
                setLocateButton("{% trans 'Localização indisponível' %}", false);
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 60000,
            }
        );
    });

    const places = JSON.parse(document.getElementById("places-data").textContent);
    const bounds = [];

    places.forEach((place) => {
        const position = [place.latitude, place.longitude];
        const thumbnail = place.thumbnail_url
            ? `<img src="${escapeHtml(place.thumbnail_url)}" alt="${escapeHtml(place.name)}">`
            : "";
        const websiteLink = place.website_url
            ? `<a href="${escapeHtml(place.website_url)}" target="_blank" rel="noopener">{% trans "Abrir página" %}</a>`
            : "";
        const description = place.description
            ? `<p>${escapeHtml(place.description).replace(/\n/g, "<br>")}</p>`
            : "";

        L.marker(position)
            .addTo(map)
            .bindTooltip(escapeHtml(place.name), {
                permanent: true,
                direction: "top",
                offset: [0, -12],
                className: "place-label",
            })
            .bindPopup(`
                <div class="place-popup">
                    ${thumbnail}
                    <h3>${escapeHtml(place.name)}</h3>
                    ${description}
                    ${websiteLink}
                </div>
            `);

        bounds.push(position);
    });

    if (bounds.length === 1) {
        map.setView(bounds[0], 15);
    } else if (bounds.length > 1) {
        map.fitBounds(bounds, {
            padding: [70, 70],
            maxZoom: 15,
        });
    }

    setTimeout(() => {
        locateButton.click();
    }, 600);
}

initMap();
</script>

</body>
</html>
