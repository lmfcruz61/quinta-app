{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Map" %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72, #2a6fd6);
            color: white;
            padding: 15px 20px;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.16);
        }

        .brand {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            opacity: 0.92;
        }

        #map {
            height: calc(100vh - 70px);
            width: 100%;
        }

        .place-label {
            padding: 5px 8px;
            border-radius: 8px;
            background: white;
            color: #1e3c72;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0,0,0,0.24);
            pointer-events: none;
        }

        .place-label::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -5px;
            transform: translateX(-50%);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 5px solid white;
        }

        .leaflet-tooltip-top.place-label {
            margin-top: -12px;
            border: none;
        }

        .leaflet-tooltip-top.place-label::before {
            display: none;
        }

        .place-popup {
            max-width: 230px;
        }

        .place-popup img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .place-popup h3 {
            margin: 0 0 6px;
            color: #1e3c72;
            font-size: 16px;
        }

        .place-popup p {
            margin: 0;
            color: #555;
            font-size: 13px;
            line-height: 1.35;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="brand">{% trans "Quinta da Ponte" %}</div>
    <a href="{% url 'guest_home' %}">⬅ {% trans "Home" %}</a>
</div>

<div id="map"></div>

{{ places_data|json_script:"places-data" }}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function initMap() {
    const center = [41.705098, -8.791817];

    const map = L.map("map").setView(center, 14);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        maxZoom: 19,
        subdomains: "abcd",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    }).addTo(map);

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value || "";
        return div.innerHTML;
    }

    const places = JSON.parse(document.getElementById("places-data").textContent);
    const bounds = [];

    places.forEach((place) => {
        const position = [place.latitude, place.longitude];
        const thumbnail = place.thumbnail_url
            ? `<img src="${escapeHtml(place.thumbnail_url)}" alt="${escapeHtml(place.name)}">`
            : "";
        const description = place.description
            ? `<p>${escapeHtml(place.description).replace(/\n/g, "<br>")}</p>`
            : "";

        L.marker(position)
            .addTo(map)
            .bindTooltip(escapeHtml(place.name), {
                permanent: true,
                direction: "top",
                offset: [0, -12],
                className: "place-label",
            })
            .bindPopup(`
                <div class="place-popup">
                    ${thumbnail}
                    <h3>${escapeHtml(place.name)}</h3>
                    ${description}
                </div>
            `);

        bounds.push(position);
    });

    if (bounds.length === 1) {
        map.setView(bounds[0], 15);
    } else if (bounds.length > 1) {
        map.fitBounds(bounds, {
            padding: [70, 70],
            maxZoom: 15,
        });
    }
}

initMap();
</script>

</body>
</html>
