{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Map" %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72, #2a6fd6);
            color: white;
            padding: 15px 20px;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        #map {
            height: calc(100vh - 70px);
            width: 100%;
        }

        .place-label {
            position: absolute;
            transform: translate(-50%, -100%);
            margin-top: -36px;
            padding: 5px 8px;
            border-radius: 8px;
            background: white;
            color: #1e3c72;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0,0,0,0.24);
            pointer-events: none;
        }

        .place-label::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -5px;
            transform: translateX(-50%);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 5px solid white;
        }

        .place-popup {
            max-width: 230px;
        }

        .place-popup img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .place-popup h3 {
            margin: 0 0 6px;
            color: #1e3c72;
            font-size: 16px;
        }

        .place-popup p {
            margin: 0;
            color: #555;
            font-size: 13px;
            line-height: 1.35;
        }
    </style>
</head>
<body>

<div class="header">
    <a href="{% url 'guest_home' %}">⬅ {% trans "Home" %}</a>
</div>

<div id="map"></div>

{{ places_data|json_script:"places-data" }}

<script>
function initMap() {

    const center = { lat: 41.705098, lng: -8.791817 };

    const map = new google.maps.Map(
        document.getElementById("map"),
        {
            zoom: 14,
            center: center,
            mapTypeId: "roadmap"
        }
    );

    const infoWindow = new google.maps.InfoWindow();
    const bounds = new google.maps.LatLngBounds();
    let placeCount = 0;

    class PlaceLabel extends google.maps.OverlayView {
        constructor(position, text) {
            super();
            this.position = position;
            this.text = text;
            this.div = null;
        }

        onAdd() {
            this.div = document.createElement("div");
            this.div.className = "place-label";
            this.div.textContent = this.text;
            this.getPanes().overlayMouseTarget.appendChild(this.div);
        }

        draw() {
            const point = this.getProjection().fromLatLngToDivPixel(this.position);
            if (!point || !this.div) return;
            this.div.style.left = `${point.x}px`;
            this.div.style.top = `${point.y}px`;
        }

        onRemove() {
            if (this.div) {
                this.div.remove();
                this.div = null;
            }
        }
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value || "";
        return div.innerHTML;
    }

    const places = JSON.parse(document.getElementById("places-data").textContent);

    places.forEach((place) => {
        const position = {
            lat: place.latitude,
            lng: place.longitude
        };
        const marker = new google.maps.Marker({
            position: position,
            map: map,
            title: place.name
        });
        bounds.extend(position);
        placeCount += 1;

        const label = new PlaceLabel(
            new google.maps.LatLng(position.lat, position.lng),
            place.name
        );
        label.setMap(map);

        marker.addListener("click", () => {
            const thumbnail = place.thumbnail_url
                ? `<img src="${escapeHtml(place.thumbnail_url)}" alt="${escapeHtml(place.name)}">`
                : "";
            const description = place.description
                ? `<p>${escapeHtml(place.description).replace(/\n/g, "<br>")}</p>`
                : "";

            infoWindow.setContent(`
                <div class="place-popup">
                    ${thumbnail}
                    <h3>${escapeHtml(place.name)}</h3>
                    ${description}
                </div>
            `);
            infoWindow.open(map, marker);
        });
    });

    if (placeCount === 1) {
        map.setCenter(bounds.getCenter());
        map.setZoom(15);
    } else if (placeCount > 1) {
        map.fitBounds(bounds, 70);
        google.maps.event.addListenerOnce(map, "bounds_changed", () => {
            if (map.getZoom() > 15) {
                map.setZoom(15);
            }
        });
    }
}
</script>

<script async defer
    src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&callback=initMap">
</script>

</body>
</html>
